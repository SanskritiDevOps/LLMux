services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: llmux
      POSTGRES_PASSWORD: llmux
      POSTGRES_DB: llmux
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmux"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    profiles: ["ollama"] # start with: docker compose --profile ollama up -d
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
